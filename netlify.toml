# URL contract frozen 2026-10-10: /page/karaoke1/ ... /page/karaoke8/ are canonical public URLs.
[build]
  command = "node scripts/build-site.mjs"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
