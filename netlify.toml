# Current canonical regional URLs: /page/karaoke01/ ... /page/karaoke08/; old /page/karaoke1-8/ URLs 301 redirect.
[build]
  command = "node scripts/build-site.mjs"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
