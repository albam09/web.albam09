# Canonical regional URLs are /page/karaoke1/ ... /page/karaoke8/.
# Former /page/karaoke01/ ... /page/karaoke08/ aliases only redirect to those canonical URLs.
# No SPA fallback rewrite to /index.html: each regional URL has its own static index.html.
[build]
  command = "node scripts/check-release.mjs && node scripts/build-site.mjs"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
