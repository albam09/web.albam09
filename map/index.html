/* ===== 광주버블여지도 CYBERPUNK THEME ===== */
:root{
  --bg:#02040a;
  --panel:#07101a;
  --line:#00f6ff;
  --text:#eaffff;
  --muted:#7aa8b5;
  --accent:#ff2bd6;
  --yellow:#ffe600;
}
html,body{
  background:#02040a;
  color:var(--text);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 4px
    );
  opacity:.38;
}
#top{
  background:linear-gradient(90deg,#02070df2,#06111cf2,#13051bf2);
  border-bottom:1px solid #00f6ff;
  box-shadow:0 0 18px #00f6ff44,0 0 35px #ff2bd620;
}
#brand{
  color:#fff;
  text-shadow:0 0 6px #00f6ff,2px 0 0 #ff2bd6;
  letter-spacing:.03em;
}
.brand-sub{
  color:#67f3fa;
  text-shadow:0 0 7px #00f6ff66;
}
.search{
  background:#02070ddd;
  border:1px solid #00eaff88;
  color:#eaffff;
  border-radius:3px;
  box-shadow:inset 0 0 14px #00eaff12,0 0 9px #00eaff16;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.search:focus{
  border-color:#ff2bd6;
  box-shadow:0 0 13px #ff2bd666;
}
.btn,.chip{
  background:#071019;
  color:#cffcff;
  border:1px solid #00eaff77;
  border-radius:3px;
  box-shadow:inset 0 0 9px #00f6ff0d;
}
.btn:hover,.chip:hover{
  background:#0a1a25;
  border-color:#00f6ff;
  box-shadow:0 0 10px #00f6ff44;
}
.btn.active{
  background:#ff2bd618;
  color:#fff;
  border-color:#ff2bd6;
  box-shadow:0 0 14px #ff2bd655;
}
#map{
  background:#010408;
}
.tile{
  filter:grayscale(1) invert(.92) sepia(.18) saturate(1.6) hue-rotate(135deg) brightness(.45) contrast(1.32);
  opacity:.92;
}
#map::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 45%,transparent 0 38%,#01040a55 75%,#000b 100%),
    linear-gradient(90deg,#00f6ff08 1px,transparent 1px),
    linear-gradient(#00f6ff08 1px,transparent 1px);
  background-size:auto,64px 64px,64px 64px;
}
#panel{
  background:linear-gradient(145deg,#06111bea,#090817e8);
  border:1px solid #00eaff88;
  border-radius:4px;
  box-shadow:0 0 22px #00f6ff1f,8px 8px 0 #ff2bd610;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.panel-head{
  border-bottom:1px solid #00eaff44;
  background:#00eaff08;
}
.panel-title{
  color:#fff;
  text-shadow:0 0 8px #00f6ff;
}
.panel-note,.place-meta{
  color:#78a8b7;
}
.place-item{
  border-bottom:1px solid #00eaff1c;
}
.place-item:hover,.place-item.active{
  background:linear-gradient(90deg,#00f6ff12,#ff2bd611);
}
.place-item.active{
  box-shadow:inset 3px 0 0 #ff2bd6;
}
.place-name{color:#dffcff;}
.pin{
  width:30px;
  height:30px;
  background:#ff2bd6;
  border:2px solid #fff;
  box-shadow:0 0 8px #fff,0 0 16px #ff2bd6,0 0 30px #ff2bd688;
  animation:cyberPulse 1.7s infinite;
}
.pin:after{
  background:#00f6ff;
  box-shadow:0 0 9px #00f6ff;
}
.marker-label{
  background:#020810ed;
  border:1px solid #00f6ff;
  color:#eaffff;
  border-radius:2px;
  box-shadow:0 0 10px #00f6ff33;
  text-shadow:0 0 6px #00f6ff77;
}
.marker.selected .marker-label{
  background:#17051a;
  color:#fff;
  border-color:#ff2bd6;
  box-shadow:0 0 14px #ff2bd677;
}
.marker.selected .pin{
  box-shadow:0 0 10px #fff,0 0 22px #ff2bd6,0 0 46px #ff2bd6;
}
@keyframes cyberPulse{
  0%,100%{filter:brightness(1);transform:rotate(-45deg) scale(1)}
  50%{filter:brightness(1.45);transform:rotate(-45deg) scale(1.08)}
}
#popup{
  background:#040a12f2;
  border:1px solid #ff2bd6;
  border-radius:3px;
  box-shadow:0 0 20px #ff2bd644,0 0 45px #00f6ff1a;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.pop-title{
  color:#fff;
  text-shadow:0 0 8px #ff2bd6;
}
.pop-sub{color:#8fc4ce;}
.pop-link{
  background:linear-gradient(90deg,#00bfc9,#00f6ff);
  color:#001014;
  border-radius:2px;
  box-shadow:0 0 12px #00f6ff55;
}
#zoom button{
  background:#030a11;
  color:#00f6ff;
  border:1px solid #00f6ff;
  border-radius:2px;
  box-shadow:0 0 10px #00f6ff33;
  text-shadow:0 0 7px #00f6ff;
}
#scale,#credit,#status{
  background:#020810e8;
  color:#8fe8ee;
  border:1px solid #00eaff55;
  border-radius:2px;
}
#credit a{color:#00f6ff;}
#status::before{
  content:"SYSTEM // ";
  color:#ff2bd6;
  font-weight:900;
}


/* ===== CYBERPUNK READABILITY FIX ===== */
#map{
  background:#0b1118 !important;
}

/* 지도 글씨/도로/건물 가독성 우선 */
.tile{
  filter:
    grayscale(.12)
    saturate(.78)

    contrast(1.08)

    linear-gradient(rgba(0,246,255,.025) 1px,transparent 1px) !important;
  background-size:auto,96px 96px,96px 96px !important;
}

/* 상단과 패널도 한 단계 밝게 */
#top{
  background:linear-gradient(90deg,rgba(7,15,24,.94),rgba(10,20,30,.94),rgba(20,8,28,.94)) !important;
}
#panel{
  background:linear-gradient(145deg,rgba(10,23,34,.88),rgba(16,13,27,.88)) !important;
}
#popup{
  background:rgba(9,18,28,.96) !important;
}

/* 지도 위 요소는 네온 유지 */
.marker-label{
  background:rgba(5,16,24,.94) !important;
}
#status,#scale,#credit{
  background:rgba(8,18,26,.88) !important;
}

/* 스캔라인도 약화 */
body::before{
  opacity:.14 !important;
}

/* 밝은 지도에서 네온 핀이 확실히 보이도록 */
.pin{
  box-shadow:
    0 0 5px #fff,
    0 0 12px #ff2bd6,
    0 0 22px rgba(255,43,214,.7) !important;
}


/* ===== MOBILE / TABLET SMOOTH PAN + PINCH ===== */
#tiles,#markers{
  will-change:transform;
  transform-origin:0 0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.tile{
  image-rendering:auto;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
#map{
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

function xToLng(x,z){return x/(Math.pow(2,z)*TILE_SIZE)*360-180}
function yToLat(y,z){const n=Math.PI-2*Math.PI*y/(Math.pow(2,z)*TILE_SIZE);return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))}
function latLngToScreen(lat,lng){const r=map.getBoundingClientRect(),cx=lngToX(center.lng,zoom),cy=latToY(center.lat,zoom);return{x:r.width/2+(lngToX(lng,zoom)-cx),y:r.height/2+(latToY(lat,zoom)-cy)}}
function setCenterFromPixels(x,y){center={lng:xToLng(x,zoom),lat:yToLat(y,zoom)}}
function tileUrl(z,x,y){return TILE_URL.replace('{z}',z).replace('{x}',x).replace('{y}',y)}
function filteredPlaces(){const q=search.value.trim().toLowerCase();return places.map((p,i)=>({...p,_i:i})).filter(p=>!q||p.name.toLowerCase().includes(q)||p.area.toLowerCase().includes(q)||p.address.toLowerCase().includes(q))}
function renderTiles(){const r=map.getBoundingClientRect(),cx=lngToX(center.lng,zoom),cy=latToY(center.lat,zoom),left=cx-r.width/2,top=cy-r.height/2,minX=Math.floor(left/TILE_SIZE)-1,maxX=Math.floor((left+r.width)/TILE_SIZE)+1,minY=Math.floor(top/TILE_SIZE)-1,maxY=Math.floor((top+r.height)/TILE_SIZE)+1,n=Math.pow(2,zoom);tiles.innerHTML='';for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const img=document.createElement('img');img.className='tile';img.alt='';img.style.opacity='0';img.src=tileUrl(zoom,((x%n)+n)%n,y);img.onload=()=>{img.style.transition='opacity .12s linear';img.style.opacity='1'};img.style.left=(x*TILE_SIZE-left)+'px';img.style.top=(y*TILE_SIZE-top)+'px';img.onerror=()=>{img.style.background='#e7ebed';img.removeAttribute('src')};tiles.appendChild(img)}scaleBox.textContent='확대 '+zoom}
function renderMarkers(){markers.innerHTML='';filteredPlaces().forEach(p=>{if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))return;const pt=latLngToScreen(p.lat,p.lng);if(pt.x<-100||pt.y<-100||pt.x>map.clientWidth+100||pt.y>map.clientHeight+100)return;const el=document.createElement('div');el.className='marker'+(selected===p._i?' selected':'');el.style.left=pt.x+'px';el.style.top=pt.y+'px';el.innerHTML=`<div class="marker-label">${p.name}</div><div class="pin"></div>`;el.onclick=e=>{e.stopPropagation();selectPlace(p._i,true)};markers.appendChild(el)})}
function renderList(){const arr=filteredPlaces();count.textContent='('+arr.length+')';placeList.innerHTML='';arr.forEach(p=>{const el=document.createElement('div');el.className='place-item'+(selected===p._i?' active':'');el.innerHTML=`<div class="place-name">${p.name}</div><div class="place-meta">${p.area}<br>${p.address}${(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))?'<br>좌표 미등록':''}</div>`;el.onclick=()=>selectPlace(p._i,true);placeList.appendChild(el)})}
function showPopup(p){const hasCoord=Number.isFinite(p.lat)&&Number.isFinite(p.lng);const pt=hasCoord?latLngToScreen(p.lat,p.lng):{x:map.clientWidth/2,y:map.clientHeight/2};popup.innerHTML=`<div class="pop-title">${p.name}</div><div class="pop-sub">${p.area}<br>${p.address}<br>${hasCoord?'좌표 '+p.lat.toFixed(6)+', '+p.lng.toFixed(6):'좌표 미등록'}</div><a class="pop-link" href="${p.url}" target="_parent" rel="nofollow">업소 상세보기</a>`;popup.style.display='block';popup.style.left=clamp(pt.x+20,8,map.clientWidth-265)+'px';popup.style.top=clamp(pt.y-145,8,map.clientHeight-145)+'px'}
function selectPlace(i,fly){selected=i;const p=places[i];if(fly&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)){center={lat:p.lat,lng:p.lng};zoom=Math.max(zoom,18)}renderTiles();renderMarkers();renderList();showPopup(p)}
function render(){renderTiles();renderMarkers();renderList();popup.style.display='none'}
function setView(lat,lng,z){center={lat,lng};zoom=clamp(z,MIN_ZOOM,MAX_ZOOM);selected=-1;render()}
function zoomAt(delta,cx,cy){const old=zoom,nz=clamp(zoom+delta,MIN_ZOOM,MAX_ZOOM);if(nz===old)return;const r=map.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top,ocx=lngToX(center.lng,old),ocy=latToY(center.lat,old),ax=ocx+(sx-r.width/2),ay=ocy+(sy-r.height/2),alng=xToLng(ax,old),alat=yToLat(ay,old);zoom=nz;const nax=lngToX(alng,nz),nay=latToY(alat,nz);setCenterFromPixels(nax-(sx-r.width/2),nay-(sy-r.height/2));render()}
/* ===== 부드러운 드래그 + 모바일/태블릿 핀치 줌 ===== */
const activePointers=new Map();
let gestureMode='none';
let gestureStart=null;
let gestureScale=1;
let rafId=0;

function setGestureTransform(dx,dy,s=1,originX=map.clientWidth/2,originY=map.clientHeight/2){
  const t=`translate(${dx}px,${dy}px) scale(${s})`;
  tiles.style.transformOrigin=`${originX}px ${originY}px`;
  markers.style.transformOrigin=`${originX}px ${originY}px`;
  tiles.style.transform=t;
  markers.style.transform=t;
}
function clearGestureTransform(){
  tiles.style.transform='none';
  markers.style.transform='none';
  tiles.style.transformOrigin='0 0';
  markers.style.transformOrigin='0 0';
}
function screenToWorldLatLng(sx,sy,z=zoom){
  const r=map.getBoundingClientRect();
  const cx=lngToX(center.lng,z),cy=latToY(center.lat,z);
  return {
    lng:xToLng(cx+(sx-r.width/2),z),
    lat:yToLat(cy+(sy-r.height/2),z)
  };
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

map.addEventListener('wheel',e=>{
  e.preventDefault();
  const dir=e.deltaY<0?1:-1;
  const scalePreview=dir>0?1.12:.90;
  const r=map.getBoundingClientRect();
  const ox=e.clientX-r.left, oy=e.clientY-r.top;
  setGestureTransform(0,0,scalePreview,ox,oy);
  clearTimeout(map._wheelTimer);
  map._wheelTimer=setTimeout(()=>{
    clearGestureTransform();
    zoomAt(dir,e.clientX,e.clientY);
  },55);
},{passive:false});

map.addEventListener('pointerdown',e=>{
  if(e.target.closest('.marker,#zoom,#popup,#panel'))return;
  map.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  popup.style.display='none';

  if(activePointers.size===1){
    gestureMode='pan';
    gestureStart={
      x:e.clientX,y:e.clientY,
      centerPx:{x:lngToX(center.lng,zoom),y:latToY(center.lat,zoom)}
    };
    map.classList.add('dragging');
  }else if(activePointers.size===2){
    const pts=[...activePointers.values()];
    const mid=midpoint(pts[0],pts[1]);
    const r=map.getBoundingClientRect();
    gestureMode='pinch';
    gestureStart={
      dist:distance(pts[0],pts[1]),
      mid,
      center:{...center},
      zoom,
      anchor:screenToWorldLatLng(mid.x-r.left,mid.y-r.top)
    };
  }
});

map.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    if(activePointers.size===1 && gestureMode==='pan'){
      const p=[...activePointers.values()][0];
      const dx=p.x-gestureStart.x;
      const dy=p.y-gestureStart.y;
      setGestureTransform(dx,dy,1);
    }else if(activePointers.size>=2){
      const pts=[...activePointers.values()].slice(0,2);
      const mid=midpoint(pts[0],pts[1]);
      const d=distance(pts[0],pts[1]);
      gestureScale=Math.max(.55,Math.min(1.9,d/gestureStart.dist));
      const dx=mid.x-gestureStart.mid.x;
      const dy=mid.y-gestureStart.mid.y;
      const r=map.getBoundingClientRect();
      setGestureTransform(dx,dy,gestureScale,gestureStart.mid.x-r.left,gestureStart.mid.y-r.top);
    }
  });
});

function finishGesture(e){
  const oldPoints=[...activePointers.values()];
  activePointers.delete(e.pointerId);

  if(gestureMode==='pan' && gestureStart && oldPoints.length===1){
    const p=oldPoints[0];
    const dx=p.x-gestureStart.x;
    const dy=p.y-gestureStart.y;
    setCenterFromPixels(
      gestureStart.centerPx.x-dx,
      gestureStart.centerPx.y-dy
    );
    clearGestureTransform();
    render();
  }else if(gestureMode==='pinch' && gestureStart){
    const r=map.getBoundingClientRect();
    const remaining=[...activePointers.values()];
    const lastTwo=oldPoints.slice(0,2);
    const endMid=lastTwo.length===2?midpoint(lastTwo[0],lastTwo[1]):gestureStart.mid;
    const endDist=lastTwo.length===2?distance(lastTwo[0],lastTwo[1]):gestureStart.dist;
    const ratio=Math.max(.45,Math.min(2.2,endDist/gestureStart.dist));
    const dz=Math.round(Math.log2(ratio));
    const newZoom=clamp(gestureStart.zoom+dz,MIN_ZOOM,MAX_ZOOM);

    // 핀치 중심점이 같은 지점을 가리키도록 중심 보정
    zoom=newZoom;
    const ax=lngToX(gestureStart.anchor.lng,zoom);
    const ay=latToY(gestureStart.anchor.lat,zoom);
    const sx=endMid.x-r.left, sy=endMid.y-r.top;
    setCenterFromPixels(
      ax-(sx-r.width/2),
      ay-(sy-r.height/2)
    );
    clearGestureTransform();
    render();

    if(remaining.length===1){
      const p=remaining[0];
      gestureMode='pan';
      gestureStart={
        x:p.x,y:p.y,
        centerPx:{x:lngToX(center.lng,zoom),y:latToY(center.lat,zoom)}
      };
      return;
    }
  }

  if(activePointers.size===0){
    gestureMode='none';
    gestureStart=null;
    map.classList.remove('dragging');
  }
}

map.addEventListener('pointerup',finishGesture);
map.addEventListener('pointercancel',finishGesture);

document.getElementById('plus').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1,r.left+r.width/2,r.top+r.height/2)};document.getElementById('minus').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(-1,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('allBtn').onclick=()=>setView(35.1595,126.8526,13);document.getElementById('sangmuBtn').onclick=()=>setView(35.1595000,126.8526000,13);
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setView(+b.dataset.lat,+b.dataset.lng,+b.dataset.z));
search.addEventListener('input',()=>{selected=-1;renderMarkers();renderList();popup.style.display='none'});window.addEventListener('resize',render);render();
</script>
