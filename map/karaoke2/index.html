const addressWait={last:0,pending:new Map()};
function reverseSelectedVenue(p){
 if(p.addressVerified || !Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
 const coordKey=p.lat.toFixed(6)+','+p.lng.toFixed(6),cacheKey='ab09-address-v2:'+coordKey;
 try {const old=JSON.parse(localStorage.getItem(cacheKey)||'null');
  if(old && typeof old.value==='string' && Date.now()-old.at<2592000000){
    if(old.value && old.value!==p.address){p.address=old.value;renderList();if(places[selected]===p)showPopup(p);}
    return;
  }
 }catch(_e){}
 if(addressWait.pending.has(coordKey))return;
 const job=(async()=>{
  const wait=Math.max(0,1300-(Date.now()-addressWait.last));
  if(wait)await new Promise(r=>setTimeout(r,wait));
  addressWait.last=Date.now();
  const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ko&lat='+encodeURIComponent(p.lat)+'&lon='+encodeURIComponent(p.lng);
  try {
   const resp=await fetch(url,{headers:{'Accept':'application/json'},mode:'cors'});
   if(!resp.ok)return;
   const body=await resp.json(),a=body.address||{};
   const road=a.road||a.pedestrian||a.residential||'';
   const house=a.house_number||'';
   const dong=a.suburb||a.neighbourhood||a.quarter||a.city_district||a.town||a.village||'';
   const province=a.state||a.province||'';
   const city=a.city||a.county||a.municipality||'';
   const streetOrLot=house && road?road+' '+house:(house && dong?dong+' '+house:'');
   if(!streetOrLot)return; // No house number: don't manufacture or mislabel a parcel.
   const result=[province,city,streetOrLot].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();

   try{localStorage.setItem(cacheKey,JSON.stringify({value:result,at:Date.now()}));}catch(_e){}

  }catch(_e){/* Offline or geocoding service unavailable; broad area remains visible. */}

function render(){renderTiles();renderMarkers();renderList();popup.style.display='none'}
function setView(lat,lng,z){center={lat,lng};zoom=clamp(z,MIN_ZOOM,MAX_ZOOM);selected=-1;render()}
function zoomAt(delta,cx,cy){const old=zoom,nz=clamp(zoom+delta,MIN_ZOOM,MAX_ZOOM);if(nz===old)return;const r=map.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top,ocx=lngToX(center.lng,old),ocy=latToY(center.lat,old),ax=ocx+(sx-r.width/2),ay=ocy+(sy-r.height/2),alng=xToLng(ax,old),alat=yToLat(ay,old);zoom=nz;const nax=lngToX(alng,nz),nay=latToY(alat,nz);setCenterFromPixels(nax-(sx-r.width/2),nay-(sy-r.height/2));render()}
/* ===== 부드러운 드래그 + 모바일/태블릿 핀치 줌 ===== */
const activePointers=new Map();
let gestureMode='none';
let gestureStart=null;
let gestureScale=1;
let rafId=0;

function setGestureTransform(dx,dy,s=1,originX=map.clientWidth/2,originY=map.clientHeight/2){
  const t=`translate(${dx}px,${dy}px) scale(${s})`;
  tiles.style.transformOrigin=`${originX}px ${originY}px`;
  markers.style.transformOrigin=`${originX}px ${originY}px`;
  tiles.style.transform=t;
  markers.style.transform=t;
}
function clearGestureTransform(){
  tiles.style.transform='none';
  markers.style.transform='none';
  tiles.style.transformOrigin='0 0';
  markers.style.transformOrigin='0 0';
}
function screenToWorldLatLng(sx,sy,z=zoom){
  const r=map.getBoundingClientRect();
  const cx=lngToX(center.lng,z),cy=latToY(center.lat,z);
  return {
    lng:xToLng(cx+(sx-r.width/2),z),
    lat:yToLat(cy+(sy-r.height/2),z)
  };
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

map.addEventListener('wheel',e=>{
  e.preventDefault();
  const dir=e.deltaY<0?1:-1;
  const scalePreview=dir>0?1.12:.90;
  const r=map.getBoundingClientRect();
  const ox=e.clientX-r.left, oy=e.clientY-r.top;
  setGestureTransform(0,0,scalePreview,ox,oy);
  clearTimeout(map._wheelTimer);
  map._wheelTimer=setTimeout(()=>{
    clearGestureTransform();
    zoomAt(dir,e.clientX,e.clientY);
  },55);
},{passive:false});

map.addEventListener('pointerdown',e=>{
  if(e.target.closest('.marker,#zoom,#popup,#panel'))return;
  map.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  popup.style.display='none';

  if(activePointers.size===1){
    gestureMode='pan';
    gestureStart={
      x:e.clientX,y:e.clientY,
      centerPx:{x:lngToX(center.lng,zoom),y:latToY(center.lat,zoom)}
    };
    map.classList.add('dragging');
  }else if(activePointers.size===2){
    const pts=[...activePointers.values()];
    const mid=midpoint(pts[0],pts[1]);
    const r=map.getBoundingClientRect();
    gestureMode='pinch';
    gestureStart={
      dist:distance(pts[0],pts[1]),
      mid,
      center:{...center},
      zoom,
      anchor:screenToWorldLatLng(mid.x-r.left,mid.y-r.top)
    };
  }
});

map.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    if(activePointers.size===1 && gestureMode==='pan'){
      const p=[...activePointers.values()][0];
      const dx=p.x-gestureStart.x;
      const dy=p.y-gestureStart.y;
      setGestureTransform(dx,dy,1);
    }else if(activePointers.size>=2){
      const pts=[...activePointers.values()].slice(0,2);
      const mid=midpoint(pts[0],pts[1]);
      const d=distance(pts[0],pts[1]);
      gestureScale=Math.max(.55,Math.min(1.9,d/gestureStart.dist));
      const dx=mid.x-gestureStart.mid.x;
      const dy=mid.y-gestureStart.mid.y;
      const r=map.getBoundingClientRect();
      setGestureTransform(dx,dy,gestureScale,gestureStart.mid.x-r.left,gestureStart.mid.y-r.top);
    }
  });
});

function finishGesture(e){
  const oldPoints=[...activePointers.values()];
  activePointers.delete(e.pointerId);

  if(gestureMode==='pan' && gestureStart && oldPoints.length===1){
    const p=oldPoints[0];
    const dx=p.x-gestureStart.x;
    const dy=p.y-gestureStart.y;
    setCenterFromPixels(
      gestureStart.centerPx.x-dx,
      gestureStart.centerPx.y-dy
    );
    clearGestureTransform();
    render();
  }else if(gestureMode==='pinch' && gestureStart){
    const r=map.getBoundingClientRect();
    const remaining=[...activePointers.values()];
    const lastTwo=oldPoints.slice(0,2);
    const endMid=lastTwo.length===2?midpoint(lastTwo[0],lastTwo[1]):gestureStart.mid;
    const endDist=lastTwo.length===2?distance(lastTwo[0],lastTwo[1]):gestureStart.dist;
    const ratio=Math.max(.45,Math.min(2.2,endDist/gestureStart.dist));
    const dz=Math.round(Math.log2(ratio));
    const newZoom=clamp(gestureStart.zoom+dz,MIN_ZOOM,MAX_ZOOM);

    // 핀치 중심점이 같은 지점을 가리키도록 중심 보정
    zoom=newZoom;
    const ax=lngToX(gestureStart.anchor.lng,zoom);
    const ay=latToY(gestureStart.anchor.lat,zoom);
    const sx=endMid.x-r.left, sy=endMid.y-r.top;
    setCenterFromPixels(
      ax-(sx-r.width/2),
      ay-(sy-r.height/2)
    );
    clearGestureTransform();
    render();

    if(remaining.length===1){
      const p=remaining[0];
      gestureMode='pan';
      gestureStart={
        x:p.x,y:p.y,
        centerPx:{x:lngToX(center.lng,zoom),y:latToY(center.lat,zoom)}
      };
      return;
    }
  }

  if(activePointers.size===0){
    gestureMode='none';
    gestureStart=null;
    map.classList.remove('dragging');
  }
}

map.addEventListener('pointerup',finishGesture);
map.addEventListener('pointercancel',finishGesture);

document.getElementById('plus').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1,r.left+r.width/2,r.top+r.height/2)};document.getElementById('minus').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(-1,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('allBtn').onclick=()=>setView(35.1595,126.8526,13);document.getElementById('sangmuBtn').onclick=()=>setView(35.1524917,126.8500854,16);
/* chip actions are registered by REGION_BUTTON_ACTUAL_MARKERS_20261031 below */
search.addEventListener('input',()=>{selected=-1;renderMarkers();renderList();popup.style.display='none'});window.addEventListener('resize',render);render();
// Deep link from every regional venue card: /map/karaokeN/?venue=VENUE_SLUG.
// Matching slug prevents similarly named venues from selecting the wrong marker.
/* REGION_BUTTON_ACTUAL_MARKERS_20261031
 * Quick area buttons filter to actual registered venues and center on their REAL marker cluster.
 * No 'empty map' hardcoded camera jump. On areas with zero registered venues, show
 * nearby registered businesses with a clear notice (never imply local registration).
 */

function actualValidPoints(arr){return arr.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng))}
function approxDistanceMeters(a,b){
 const dl=(a.lat-b.lat)*111132,dx=(a.lng-b.lng)*111132*Math.cos(a.lat*Math.PI/180);
 return Math.hypot(dl,dx);
}
function nearbyForChip(label){
 const mapping={
  '상무지구':['상무지구'],
  '광천동':['광천동 · 금호동','상무·광천동'],
  '용봉동':['용봉동'],
  '신안동':['신안동'],
  '첨단':['첨단지구']
 };
 return places.filter(p=>(mapping[label]||[]).includes(p.area));
}
function clusterView(arr){
 const ps=actualValidPoints(arr);
 if(!ps.length)return null;
 // Pick the highest concentration of recorded markers (not a preset neighborhood coordinate).
 let best=ps[0],score=-1;
 ps.forEach(p=>{
  const s=ps.filter(q=>approxDistanceMeters(p,q)<900).length;
  if(s>score){score=s;best=p;}
 });
 const near=ps.filter(p=>approxDistanceMeters(best,p)<1200);
 const lat=near.reduce((a,p)=>a+p.lat,0)/near.length;
 const lng=near.reduce((a,p)=>a+p.lng,0)/near.length;
 const width=Math.max(250,map.clientWidth-(window.innerWidth>820?330:0));
 const height=Math.max(240,map.clientHeight-(window.innerWidth<=820?190:60));
 // Keep ALL close markers visible; never zoom to level 18 when the pins are scattered.
 let z=17;
 while(z>11){
  const minx=Math.min(...near.map(p=>lngToX(p.lng,z))),maxx=Math.max(...near.map(p=>lngToX(p.lng,z)));
  const miny=Math.min(...near.map(p=>latToY(p.lat,z))),maxy=Math.max(...near.map(p=>latToY(p.lat,z)));
  if(maxx-minx<width*.80 && maxy-miny<height*.74)break;
  z--;
 }
 return {center:{lat,lng},zoom:z};
}
function showActualArea(label,chip){
 search.value='';selected=-1;
 const matching=actualValidPoints(nearbyForChip(label));
 let subset=matching;
 let adjacent=false;
 if(!subset.length){
  adjacent=true;
  const ref={lat:Number(chip.dataset.lat),lng:Number(chip.dataset.lng)};
  subset=actualValidPoints(places).slice().sort((a,b)=>approxDistanceMeters(a,ref)-approxDistanceMeters(b,ref)).slice(0,6);
 }
 visibleVenueSlugs=new Set(subset.map(p=>p.slug));
 const focus=clusterView(subset);
 if(focus){center=focus.center;zoom=focus.zoom;}
 document.querySelectorAll('.chip').forEach(btn=>{const on=btn===chip;btn.classList.toggle('selected-area',on);btn.setAttribute('aria-pressed',on?'true':'false')});
 if(regionPanelTitle)regionPanelTitle.firstChild.textContent=label+(adjacent?' 인근 등록 업소 ':' 등록 업소 ');
 if(regionPanelNote)regionPanelNote.textContent=adjacent
  ? label+' 일대에 등록된 업소가 없어 가까운 등록 업소 '+subset.length+'곳을 표시합니다.'
  : label+' 등록 업소 '+subset.length+'곳을 실제 위치에 표시합니다.';
 render();
 // A label and marker must be visible even when the original hardcoded chip had no pins.
 const shown=markers.querySelectorAll('.marker');
 if(!shown.length && subset.length){
  const p=subset[0];center={lat:p.lat,lng:p.lng};zoom=16;render();
 }
}
function restoreRealInventory(){
 visibleVenueSlugs=null; search.value='';selected=-1;
 document.querySelectorAll('.chip').forEach(btn=>{btn.classList.remove('selected-area');btn.setAttribute('aria-pressed','false')});
 if(regionPanelNote)regionPanelNote.textContent=basePanelNote;
 if(regionPanelTitle)regionPanelTitle.firstChild.textContent=basePanelTitle;
 const focus=clusterView(places);
 if(focus){center=focus.center;zoom=Math.min(15,focus.zoom);}
 render();
}
// Same behavior on /map/ and on /map/karaokeN/ (some regional pages have zero local listings).
document.querySelectorAll('.chip').forEach(chip=>{
 chip.onclick=()=>showActualArea(chip.textContent.trim(),chip);
 chip.setAttribute('aria-pressed','false');
});
document.getElementById('allBtn').onclick=restoreRealInventory;
document.getElementById('sangmuBtn').onclick=()=>{
 const chip=[...document.querySelectorAll('.chip')].find(x=>x.textContent.trim()==='상무지구');
 if(chip)showActualArea('상무지구',chip);
};
if(initialRegionSlugs!==null && initialRegionSlugs.length){
 const focus=clusterView(places.filter(p=>visibleVenueSlugs.has(p.slug)));
 if(focus){center=focus.center;zoom=focus.zoom;render();}
}
const directArea=new URLSearchParams(location.search).get('area');
if(directArea){
 const chip=[...document.querySelectorAll('.chip')].find(c=>c.textContent.trim()===directArea);
 if(chip)showActualArea(directArea,chip);
}

(function focusLinkedVenue(){
  const venueSlug=new URLSearchParams(window.location.search).get('venue');
  if(!venueSlug)return;
  const i=places.findIndex(p=>p.slug===venueSlug);
  if(i<0)return;
  visibleVenueSlugs=null;
  search.value='';
  selectPlace(i,true);
  const active=placeList.querySelector('.place-item.active');
  if(active)active.scrollIntoView({block:'nearest'});
  document.title=places[i].name+' 위치 지도 | 광주버블여지도';
})();
